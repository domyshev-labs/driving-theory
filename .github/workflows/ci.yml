name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: python3 scripts/validate-content.py
      - run: python3 scripts/audit-topics.py
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: node --experimental-strip-types --test scripts/test-*.mjs
      - run: npm run lint
      - run: npm run build
      - run: go test ./backend/...
      - run: go vet ./backend/...
      - run: docker build --tag driving-theory:ci .
